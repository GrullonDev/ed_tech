name: Android → Firebase App Distribution

# Se dispara solo con cada push a `develop` (build automática) y también
# se puede correr a mano desde la pestaña Actions cuando se quiere elegir
# unas notas de release específicas.
#
# Versionado 100% automático:
#   - Patch (el "Z" de X.Y.Z en pubspec.yaml): este workflow lo sube en 1
#     en cada corrida exitosa (ver paso "Sube el patch de la versión") y
#     commitea el cambio de vuelta a `develop` con "[skip ci]" en el
#     mensaje — GitHub no vuelve a disparar ningún workflow para ese
#     commit, así que no hay loop infinito. Major/minor siguen siendo
#     decisión manual (editarlos a mano en pubspec.yaml cuando corresponda
#     un cambio más grande).
#   - Build number: `github.run_number`, un contador que GitHub
#     incrementa solo en cada corrida de este workflow (nunca se repite
#     ni retrocede), pasado vía `--build-number` al compilar.
#   - Después de subir a App Distribution, el mismo workflow actualiza
#     los parámetros `latest_android_build_number` y
#     `update_download_url` en Remote Config, para que el diálogo de
#     "nueva versión disponible" de la app (`HomeLogic._checkForUpdate`)
#     se active solo, sin tocar la consola de Firebase a mano — ver
#     firebase/APP_DISTRIBUTION.md.
#
# Requiere dos secrets del repo (Settings → Secrets and variables →
# Actions):
#   - FIREBASE_SERVICE_ACCOUNT_JSON: el JSON completo de una cuenta de
#     servicio de Google Cloud con los roles **"Firebase App
#     Distribution Admin"** y **"Firebase Remote Config Admin"** en el
#     proyecto rachatribu (ver guía en firebase/APP_DISTRIBUTION.md) —
#     el segundo rol es el que hace falta para el paso de Remote Config.
#   - FIREBASE_APP_DISTRIBUTION_GROUPS: alias del grupo de testers en
#     Firebase App Distribution (por ejemplo "testers"), separados por
#     coma si hay más de uno. Ese grupo se crea una vez desde la consola
#     (Release & Monitor → App Distribution → Testers y grupos) y ahí se
#     agregan los emails de quienes van a probar.
on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Notas de la release (qué se está probando)"
        required: false
        default: "Build de prueba manual (app-distribution-android.yml)."

permissions:
  contents: write

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sube el patch de la versión en pubspec.yaml
        id: bump
        run: |
          set -euo pipefail
          CURRENT=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//')
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          sed -i "s/^version:[[:space:]]*.*/version: $NEW_VERSION/" pubspec.yaml
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Versión: $CURRENT -> $NEW_VERSION"

      # android/app/build.gradle.kts pide JDK 21 (sourceCompatibility /
      # jvmTarget = VERSION_21) — el JDK por defecto de ubuntu-latest es más
      # viejo, y sin este paso Gradle falla con "invalid source release: 21".
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build apk --release
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Subir a Firebase App Distribution
        id: upload
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: "1:315811589668:android:0fa5a262942581e48a72b1"
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: ${{ secrets.FIREBASE_APP_DISTRIBUTION_GROUPS }}
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: "${{ github.event_name == 'workflow_dispatch' && inputs.release_notes || format('Build automática (push a develop) — build {0}: {1}', github.run_number, github.event.head_commit.message) }}"

      # Sin esto, el diálogo "hay una nueva versión" de la app (Remote
      # Config) hay que activarlo a mano en la consola después de cada
      # release — ver firebase/APP_DISTRIBUTION.md. continue-on-error
      # porque un fallo acá (p. ej. falta el rol de Remote Config Admin
      # en el service account) no debería tumbar un release que a los
      # testers ya les llegó bien.
      - name: Actualiza Remote Config (diálogo de nueva versión)
        continue-on-error: true
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        # shell explícito para pisar el shell "bash -e {0}" que GitHub usa
        # por default en TODO run step (visible en el log del workflow como
        # "shell: /usr/bin/bash -e {0}") — con ese -e heredado, aunque el
        # script haga acá abajo "set -uo pipefail" (sin -e a propósito, para
        # poder chequear el código de salida a mano con los "if" de más
        # abajo), el -e original nunca se apaga. Eso causaba que el paso
        # muriera en silencio: una asignación simple como
        # `TOKEN=$(gcloud auth print-access-token ...)` NO está exenta de
        # errexit (solo lo están los comandos que son la condición de un
        # if/&&/||), así que en cuanto ese comando (o cualquiera de los dos
        # curl) devolvía un código distinto de 0, bash cortaba el script ahí
        # mismo, antes de llegar al "if" que iba a imprimir el diagnóstico —
        # confirmado en los logs de runs #20 y #21: el script corre ~6s
        # (las llamadas de red reales) y salta directo a "Process completed
        # with exit code 1" sin un solo echo/::warning:: de los que agrega
        # este mismo paso más abajo, ni siquiera el de éxito final.
        shell: bash --noprofile --norc {0}
        run: |
          set -uo pipefail
          echo "$SA_JSON" > /tmp/sa.json

          if ! gcloud auth activate-service-account --key-file=/tmp/sa.json 2>/tmp/gcloud_err.txt; then
            echo "::warning::gcloud auth activate-service-account falló:"
            cat /tmp/gcloud_err.txt
            rm -f /tmp/sa.json /tmp/gcloud_err.txt
            exit 1
          fi

          TOKEN=$(gcloud auth print-access-token 2>/tmp/gcloud_err.txt)
          if [ -z "$TOKEN" ]; then
            echo "::warning::gcloud auth print-access-token falló (posible clave privada corrupta en el secret FIREBASE_SERVICE_ACCOUNT_JSON):"
            cat /tmp/gcloud_err.txt
            rm -f /tmp/sa.json /tmp/gcloud_err.txt
            exit 1
          fi
          rm -f /tmp/sa.json /tmp/gcloud_err.txt

          # A partir de acá se valida el código HTTP de cada llamada a mano
          # (en vez de confiar en el exit code de curl, que con -sS solo
          # falla si la conexión en sí falla, NUNCA por un 4xx/5xx de la
          # API) — sin esto, un 403 por falta del rol "Firebase Remote
          # Config Admin", un 400 por ETag inválido, etc. quedaban
          # completamente invisibles: el paso terminaba en verde sin haber
          # cambiado nada de verdad en Firestore (confirmado: la consola
          # seguía mostrando la última publicación manual de días atrás
          # pese a runs "exitosos").
          GET_STATUS=$(curl -sS -o /tmp/rc_get_response.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            "https://firebaseremoteconfig.googleapis.com/v1/projects/rachatribu/remoteConfig")
          if [ "$GET_STATUS" -lt 200 ] || [ "$GET_STATUS" -ge 300 ]; then
            echo "::warning::GET a Remote Config falló (HTTP $GET_STATUS):"
            cat /tmp/rc_get_response.json
            exit 1
          fi
          RESPONSE=$(cat /tmp/rc_get_response.json)

          # Se intentó leer el header ETag para hacer el PUT con
          # concurrencia optimista (If-Match: <etag>), pero un volcado de
          # headers crudos en un run real (ver historial de este archivo)
          # confirmó que esta API, para este proyecto, no devuelve header
          # ETag en el GET (headers vistos: content-type, vary x3, date,
          # server, x-xss-protection, x-frame-options,
          # x-content-type-options, alt-svc, accept-ranges — sin etag).
          # No es un bug de parseo: nunca hubo nada que leer. Por eso el
          # PUT usa "If-Match: *", la forma que la propia doc de Remote
          # Config ofrece para saltear el control de concurrencia cuando
          # no hay riesgo de pisar una publicación manual concurrente —
          # este workflow es el único que escribe estos parámetros.

          # OJO: reemplaza el objeto `defaultValue` entero (no solo el campo
          # `.value`) a propósito. Si el parámetro se creó a mano en la
          # consola con "Usar configuración predeterminada en la app"
          # activado, queda como `defaultValue: {useInAppDefault: true}` —
          # hacer `.defaultValue.value = $build` solo AGREGA `value` a ese
          # objeto sin sacar `useInAppDefault`, y con ese flag en `true`
          # Firebase sigue sirviendo el default de la app (0, ver
          # main.dart) sin importar qué valor se publique. Reemplazar todo
          # el objeto es la única forma de garantizar que quede
          # `{value: "..."}` sin ambigüedad, corra el workflow desde cero o
          # sobre un parámetro creado a mano.
          echo "$RESPONSE" | jq \
            --arg build "${{ github.run_number }}" \
            --arg url "${{ steps.upload.outputs.TESTING_URI }}" \
            '.parameters.latest_android_build_number.defaultValue = {value: $build}
             | .parameters.update_download_url.defaultValue = {value: $url}' \
            > /tmp/rc_updated.json

          PUT_STATUS=$(curl -sS -o /tmp/rc_put_response.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json; UTF-8" \
            -H "If-Match: *" \
            -d @/tmp/rc_updated.json \
            "https://firebaseremoteconfig.googleapis.com/v1/projects/rachatribu/remoteConfig")
          if [ "$PUT_STATUS" -lt 200 ] || [ "$PUT_STATUS" -ge 300 ]; then
            echo "::warning::PUT a Remote Config falló (HTTP $PUT_STATUS) — el build number/URL NO se actualizaron:"
            cat /tmp/rc_put_response.json
            exit 1
          fi
          echo "Remote Config actualizado con éxito (HTTP $PUT_STATUS)."

      - name: Commitea el bump de versión de vuelta a develop
        if: github.ref == 'refs/heads/develop'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: sube versión a ${{ steps.bump.outputs.new_version }} [skip ci]"
          git push origin HEAD:develop
