name: edtech_tiktok
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.3

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  cached_network_image: ^4.0.0
  google_fonts: ^6.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.3
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_analytics: ^11.3.4
  firebase_crashlytics: ^4.1.3
  firebase_performance: ^0.10.0+11
  firebase_remote_config: ^5.1.3
  google_sign_in: ^6.2.1
  liquid_glass_widgets: ^1.4.4
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  remove_alpha_ios: true
  background_color_ios: "#FEF3C7"

flutter:

  uses-material-design: true

  assets:
    - assets/images/


